[project]
name = "nixcache-oci"
version = "0.1.0"
description = "Nix binary cache backed by GHCR OCI registry"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nixcache-proxy = "nixcache.proxy:main"
nixcache-upload = "nixcache.upload:main"
nixcache-gc = "nixcache.gc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nixcache"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T201",    # print - used intentionally for stderr logging
    "S311",    # pseudo-random - not used for crypto
    "S603",    # subprocess audit - intentional nix/nix-store calls
    "S607",    # partial executable path - intentional
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # conflicts with ruff format
]
