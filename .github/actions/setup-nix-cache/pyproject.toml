[project]
name = "nixcache-oci"
version = "0.1.0"
description = "Nix binary cache backed by GHCR OCI registry"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nixcache-proxy = "nixcache.proxy:main"
nixcache-upload = "nixcache.upload:main"
nixcache-gc = "nixcache.gc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nixcache"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
