name: Save Nix cache

description: |
  Upload locally-built store paths to the OCI cache on ghcr.io.
  Run after `setup-nix-cache` and all build steps, with `if: always()`
  so the cache is saved even when the build fails.

inputs:
  out-link:
    description: Nix output symlink to record as a GC root in the cache index.
    required: false
    default: result

runs:
  using: composite
  steps:
    - name: Upload locally-built paths to OCI cache
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        NIXCACHE_REPO: ${{ github.repository }}
      run: |
        python3 ${{ github.action_path }}/../lib/upload.py --out-link ${{ inputs.out-link }}
