name: Save Nix cache

description: |
  Upload locally-built store paths to the OCI cache on ghcr.io.
  Run after `setup-nix-cache` and all build steps, with `if: always()`
  so the cache is saved even when the build fails.

inputs:
  out-link:
    description: Nix output symlink to record as a GC root in the cache index.
    required: false
    default: result

runs:
  using: composite
  steps:
    - name: Upload locally-built paths to OCI cache
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        NIXCACHE_REPO: ${{ github.repository }}
      run: |
        source ${{ github.action_path }}/../lib/cache-builder.sh
        upload_list=$(find_locally_built_paths)
        mapfile -t upload_array <<< "$upload_list"
        if [[ -z "${upload_array[0]:-}" ]]; then
          echo "Nothing to upload; store has no locally-built paths"
          exit 0
        fi
        export_paths_directly "${upload_array[@]}"
        top_level=$(nix path-info ${{ inputs.out-link }})
        upload_to_oci "$top_level"
