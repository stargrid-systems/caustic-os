name: Setup Nix with OCI cache

description: |
  Installs Determinate Nix and starts the nixcache-oci proxy as a local
  substituter backed by ghcr.io. Automatically uploads locally-built store
  paths at the end of the job via the post hook.

  Required caller env:
    NIX_CACHE_PRIVATE_KEY  nix cache signing key (secret)

inputs:
  public-key:
    description: Public key for the nix cache, used to validate signed NARs.
    required: true
  out-link:
    description: Nix output symlink to record as a GC root in the cache index.
    required: false
    default: result
  save:
    description: Upload locally-built paths at the end of the job via the post hook.
    required: false
    default: "true"
  force:
    description: Re-upload all non-baseline paths, ignoring index. Use to repair missing NAR blobs.
    required: false
    default: "false"

runs:
  using: node24
  main: main.js
  post: post.js
  post-if: always()
