name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    name: Open release PR
    if: |
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next CalVer version
        id: calver
        run: |
          set -euo pipefail
          today=$(date -u +'%Y.%m')

          from_tags=$(
            git tag --list "${today}.*" \
              | sed "s/^${today}\.//" \
              | sort -n \
              | tail -1
          )

          from_file=""
          if [ -f version.txt ]; then
            current=$(tr -d '[:space:]' < version.txt)
            from_file=$(printf '%s\n' "$current" | sed -n "s/^${today}\.\([0-9]\+\)$/\1/p")
          fi

          highest=$(
            printf '%s\n%s\n' "${from_tags:-}" "${from_file:-}" \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -1
          )

          if [ -z "$highest" ]; then
            next=1
          else
            next=$(( highest + 1 ))
          fi
          echo "version=${today}.${next}" >> "$GITHUB_OUTPUT"

      - name: Bump version.txt
        run: printf '%s\n' '${{ steps.calver.outputs.version }}' > version.txt

      - name: Build changelog
        id: changelog
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
            since="since ${last_tag}"
          else
            range="HEAD"
            since="since the start of history"
          fi
          {
            echo "body<<EOF"
            echo "## What's changed ${since}"
            echo
            git log "${range}" --pretty=format:'- %s' --no-merges | head -100 || true
            echo
            echo
            echo "Merging this PR cuts release **${VERSION}**."
            echo "The merge commit is tagged. The dev image builds immediately."
            echo "The prod image build runs in the \`prod\` environment and waits for approval."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: release-next
          title: "release: ${{ steps.calver.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          labels: release
          commit-message: "release: bump version.txt to ${{ steps.calver.outputs.version }}"

  tag:
    name: Tag release
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          v=$(tr -d '[:space:]' < version.txt)
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/release-notes.md
          gh release create "${VERSION}" \
            --target "${MERGE_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --draft

  build-dev:
    name: Build dev image
    needs: tag
    runs-on: ubuntu-26.04-arm
    environment: dev
    env:
      NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          out-link: update
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build dev update package
        run: |
          nix build \
            --keep-going \
            .#nixosConfigurations.devImage.config.system.build.updatePackage \
            --out-link update \
            --print-build-logs

      - name: Compose OCI artifact
        run: |
          mkdir -p artifact
          cp -L update/* artifact/

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI artifact
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          oras push \
            ghcr.io/${{ github.repository }}-dev:${VERSION} \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            $(find artifact -type f -printf '%p:%f ')

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          printf '%s' "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          trap 'rm -f /tmp/cosign.key' EXIT
          cosign sign --yes --key /tmp/cosign.key \
            ghcr.io/${{ github.repository }}-dev:${VERSION}

  runtime-test:
    name: Runtime test
    needs: build-dev
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Nix for NixOS tests
        run: |
          echo "system-features = nixos-test benchmark big-parallel kvm" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Run runtime test
        run: nix build .#tests.aarch64-linux.runtime -L --print-build-logs

  build-prod:
    name: Build prod image
    needs: [tag, runtime-test]
    runs-on: ubuntu-26.04-arm
    environment: prod
    env:
      NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Materialize Secure Boot keys
        env:
          DB_KEY: ${{ secrets.SECUREBOOT_DB_KEY }}
          DB_CERT: ${{ secrets.SECUREBOOT_DB_CERT }}
        run: |
          keys_dir="$(mktemp -d)"
          printf '%s' "$DB_KEY" > "${keys_dir}/db.key"
          printf '%s' "$DB_CERT" > "${keys_dir}/db.crt"
          echo "keys_dir=${keys_dir}" >> "$GITHUB_ENV"

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          out-link: update
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build production update package
        env:
          CAUSTIC_SECUREBOOT_KEYS: ${{ env.keys_dir }}
        run: |
          nix build --impure --keep-going \
            .#nixosConfigurations.production.config.system.build.updatePackage \
            --out-link update \
            --print-build-logs

      - name: Compose OCI artifact
        run: |
          mkdir -p artifact
          cp -L update/* artifact/

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI artifact
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          oras push \
            ghcr.io/${{ github.repository }}:${VERSION} \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            $(find artifact -type f -printf '%p:%f ')

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          printf '%s' "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          trap 'rm -f /tmp/cosign.key' EXIT
          cosign sign --yes --key /tmp/cosign.key \
            ghcr.io/${{ github.repository }}:${VERSION}

  publish:
    name: Publish release
    needs: [tag, build-prod]
    runs-on: ubuntu-slim
    steps:
      - name: Mark release as non-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release edit "${VERSION}" --repo ${{ github.repository }} --draft=false

  cleanup-on-failure:
    name: Cleanup stale draft
    needs: [tag, publish]
    if: always() && needs.tag.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-slim
    steps:
      - name: Delete draft release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release delete "${VERSION}" \
            --repo ${{ github.repository }} \
            --cleanup-tag \
            --yes
