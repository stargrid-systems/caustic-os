name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

env:
  NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

jobs:
  open-pr:
    name: Open release PR
    if: |
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open release PR
        uses: stargrid-systems/calver-release@1c45aa1ec6ea7a659798dadbf33ac260c63cc350  # v2.0.0
        with:
          version-file: version.txt
          changelog-trailer: |
            The merge commit is tagged. The dev image builds immediately.
            The prod image build runs in the `prod` environment and waits for approval.

  tag:
    name: Tag release
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - id: tag
        name: Create draft release
        uses: stargrid-systems/calver-release@1c45aa1ec6ea7a659798dadbf33ac260c63cc350  # v2.0.0
        with:
          version-file: version.txt
          mode: tag
          draft: "true"

  build-dev:
    name: Build dev image
    needs: tag
    runs-on: ubuntu-26.04-arm
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          out-link: update

      - name: Build dev update package
        run: |
          nix build \
            --keep-going \
            .#nixosConfigurations.devImage.config.system.build.updatePackage \
            --out-link update

      - name: Exclude image-only paths from cache
        run: |
          comm -13 \
            <(nix path-info --recursive \
              .#nixosConfigurations.devImage.config.system.build.toplevel | sort) \
            <(nix path-info --recursive "$(readlink -f update)" | sort) \
            >> "$NIXCACHE_STORE_BASELINE"

      - name: Compose OCI artifact
        run: |
          mkdir -p artifact
          cp -L update/* artifact/

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI artifact
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          oras push \
            ghcr.io/${{ github.repository }}-dev:${VERSION} \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            $(find artifact -type f -printf '%p:%f ')

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          printf '%s' "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          trap 'rm -f /tmp/cosign.key' EXIT
          cosign sign --yes --key /tmp/cosign.key \
            ghcr.io/${{ github.repository }}-dev:${VERSION}

  runtime-test:
    name: Runtime test
    needs: build-dev
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          kvm: true

      - name: Run runtime test
        run: nix build .#tests.aarch64-linux.runtime -L

  build-prod:
    name: Build prod image
    needs: [tag, runtime-test]
    runs-on: ubuntu-26.04-arm
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Materialize Secure Boot keys
        env:
          DB_KEY: ${{ secrets.SECUREBOOT_DB_KEY }}
          DB_CERT: ${{ secrets.SECUREBOOT_DB_CERT }}
        run: |
          keys_dir="$(mktemp -d)"
          printf '%s' "$DB_KEY" > "${keys_dir}/db.key"
          printf '%s' "$DB_CERT" > "${keys_dir}/db.crt"
          echo "keys_dir=${keys_dir}" >> "$GITHUB_ENV"

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          out-link: update

      - name: Build production update package
        env:
          CAUSTIC_SECUREBOOT_KEYS: ${{ env.keys_dir }}
        run: |
          nix build --impure --keep-going \
            .#nixosConfigurations.production.config.system.build.updatePackage \
            --out-link update

      - name: Exclude image-only paths from cache
        env:
          CAUSTIC_SECUREBOOT_KEYS: ${{ env.keys_dir }}
        run: |
          comm -13 \
            <(nix path-info --recursive --impure \
              .#nixosConfigurations.production.config.system.build.toplevel | sort) \
            <(nix path-info --recursive "$(readlink -f update)" | sort) \
            >> "$NIXCACHE_STORE_BASELINE"

      - name: Compose OCI artifact
        run: |
          mkdir -p artifact
          cp -L update/* artifact/

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI artifact
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          oras push \
            ghcr.io/${{ github.repository }}:${VERSION} \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            $(find artifact -type f -printf '%p:%f ')

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          printf '%s' "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          trap 'rm -f /tmp/cosign.key' EXIT
          cosign sign --yes --key /tmp/cosign.key \
            ghcr.io/${{ github.repository }}:${VERSION}

  publish:
    name: Publish release
    needs: [tag, build-prod]
    runs-on: ubuntu-slim
    steps:
      - name: Mark release as non-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release edit "${VERSION}" --repo ${{ github.repository }} --draft=false

  cleanup-on-failure:
    name: Cleanup stale draft
    needs: [tag, publish]
    if: always() && needs.tag.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-slim
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release delete "${VERSION}" \
            --repo ${{ github.repository }} \
            --yes
