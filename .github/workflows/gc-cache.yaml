name: Garbage collect OCI cache

on:
  schedule:
    - cron: '0 3 * * 0'  # weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: Delete entries older than N days not in a current release closure
        required: false
        default: '30'
        type: string
      dry_run:
        description: Report what would be deleted without deleting
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  gc:
    name: Prune stale cache entries
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          save: false

      - name: Compute live closure
        run: |
          nix build --no-link \
            .#nixosConfigurations.devImage.config.system.build.updatePackage
          nix path-info --recursive \
            .#nixosConfigurations.devImage.config.system.build.updatePackage \
            | xargs -I{} basename {} | cut -c1-32 | sort -u \
            > "${RUNNER_TEMP}/live-hashes.txt"
          echo "Live hashes: $(wc -l < "${RUNNER_TEMP}/live-hashes.txt")"

      - name: Prune index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXCACHE_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ "${{ github.event_name == 'schedule' || inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run --project .github/actions/setup-nix-cache nixcache-gc \
            "${RUNNER_TEMP}/live-hashes.txt" \
            --retention-days "${{ inputs.retention_days || '30' }}" \
            "${args[@]}"
