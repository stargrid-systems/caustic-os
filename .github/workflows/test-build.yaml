name: Test build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Nix installable to build
        required: true
        default: .#packages.aarch64-linux.cache-test
        type: choice
        options:
          - .#packages.aarch64-linux.cache-test
          - .#packages.aarch64-linux.caustic-ota
          - .#packages.aarch64-linux.aperture
          - .#nixosConfigurations.devImage.config.boot.kernelPackages.kernel
          - .#nixosConfigurations.devImage.config.system.build.toplevel
          - .#nixosConfigurations.devImage.config.system.build.updatePackage
          - .#nixosConfigurations.production.config.system.build.updatePackage

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-26.04-arm
    environment: dev
    env:
      NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Materialize test Secure Boot keys
        if: contains(inputs.target, '.production.')
        run: |
          # Generate throwaway keys so the prod target exercises the same
          # ukify + sbsign + sbverify code path as a real release build,
          # without needing the prod-only SECUREBOOT_DB_* secrets here.
          keys_dir="$(mktemp -d)"
          openssl req -new -x509 -newkey rsa:2048 \
            -subj "/CN=caustic-os-test" -nodes -days 1 \
            -keyout "${keys_dir}/db.key" \
            -out "${keys_dir}/db.crt"
          echo "keys_dir=${keys_dir}" >> "$GITHUB_ENV"

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Build
        env:
          CAUSTIC_SECUREBOOT_KEYS: ${{ env.keys_dir }}
        run: |
          extra=()
          if [[ "${{ inputs.target }}" == *".production."* ]]; then
            extra+=(--impure)
          fi
          nix build \
            --keep-going \
            "${extra[@]}" \
            ${{ inputs.target }} \
            --out-link result \
            --print-build-logs

      - name: Save cache
        if: always()
        uses: ./.github/actions/setup-nix-cache/save
