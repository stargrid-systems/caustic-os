name: Installer release

on:
  push:
    tags:
      - 'installer-*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Installer ${GITHUB_REF_NAME#installer-}" \
            --notes "Caustic OS installer." \
            --draft

  build-linux:
    name: Build Linux AppImage
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Build
        run: cargo build --release -p caustic-installer

      - name: Create AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#installer-}"

          convert -size 256x256 xc:'#1a1a2e' \
            -fill '#e94560' -draw 'rectangle 64,64 192,192' \
            icon.png

          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

          OUTPUT="caustic-installer-${version}-x86_64.AppImage" \
            ./linuxdeploy \
              --appdir AppDir \
              --executable "$(pwd)/target/release/caustic-installer" \
              --desktop-file crates/caustic-installer/caustic-installer.desktop \
              --icon-file icon.png \
              --output appimage

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            caustic-installer-*-x86_64.AppImage

  build-windows:
    name: Build Windows zip
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build
        run: cargo build --release -p caustic-installer

      - name: Create zip
        env:
          VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:VERSION.Substring(10)
          7z a "caustic-installer-$version-windows-x86_64.zip" `
            target/release/caustic-installer.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" caustic-installer-*-windows-x86_64.zip

  publish:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as non-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false
