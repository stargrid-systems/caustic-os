name: Installer release

on:
  push:
    tags:
      - 'installer-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version and tag
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#installer-v}"
          else
            version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/caustic-installer/Cargo.toml | head -1)
            tag="installer-v${version}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::Could not determine version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Installer ${VERSION}" \
            --notes "Caustic OS installer." \
            --draft

  build-linux:
    name: Build Linux AppImage
    needs: create-release
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Build
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          CAUSTIC_COSIGN_PUB: cosign.pub
        run: |
          printf '%s' "$COSIGN_PUBLIC_KEY" > "$CAUSTIC_COSIGN_PUB"
          cargo build --release -p caustic-installer

      - name: Create AppImage
        env:
          LINUXDEPLOY_SHA256: e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf
        run: |
          set -euo pipefail

          convert -size 256x256 xc:'#1a1a2e' \
            -fill '#e94560' -draw 'rectangle 64,64 192,192' \
            caustic-installer.png

          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy

          OUTPUT="caustic-installer-${VERSION}-x86_64.AppImage" \
            ./linuxdeploy \
              --appdir AppDir \
              --executable "$(pwd)/target/release/caustic-installer" \
              --desktop-file crates/caustic-installer/caustic-installer.desktop \
              --icon-file caustic-installer.png \
              --output appimage

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" caustic-installer-*-x86_64.AppImage

  build-windows:
    name: Build Windows zip
    needs: create-release
    runs-on: windows-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          CAUSTIC_COSIGN_PUB: cosign.pub
        run: |
          Set-Content -Path "$env:CAUSTIC_COSIGN_PUB" -Value "$env:COSIGN_PUBLIC_KEY" -NoNewline
          cargo build --release -p caustic-installer

      - name: Create zip
        shell: pwsh
        run: |
          7z a "caustic-installer-${env:VERSION}-windows-x86_64.zip" target/release/caustic-installer.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${env:TAG}" caustic-installer-*-windows-x86_64.zip

  publish:
    name: Publish release
    needs: [create-release, build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Mark release as non-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${TAG}" --repo ${{ github.repository }} --draft=false
