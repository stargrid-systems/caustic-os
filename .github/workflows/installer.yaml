name: Installer release

on:
  push:
    tags:
      - 'installer-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Determine tag name
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=installer-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#installer-}"
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Installer ${version}" \
            --notes "Caustic OS installer." \
            --draft

  build-linux:
    name: Build Linux AppImage
    needs: create-release
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Build
        run: cargo build --release -p caustic-installer

      - name: Create AppImage
        env:
          LINUXDEPLOY_SHA256: e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf
        run: |
          set -euo pipefail
          version="${TAG#installer-}"

          convert -size 256x256 xc:'#1a1a2e' \
            -fill '#e94560' -draw 'rectangle 64,64 192,192' \
            icon.png

          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy

          OUTPUT="caustic-installer-${version}-x86_64.AppImage" \
            ./linuxdeploy \
              --appdir AppDir \
              --executable "$(pwd)/target/release/caustic-installer" \
              --desktop-file crates/caustic-installer/caustic-installer.desktop \
              --icon-file icon.png \
              --output appimage

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" caustic-installer-*-x86_64.AppImage

  build-windows:
    name: Build Windows zip
    needs: create-release
    runs-on: windows-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build
        run: cargo build --release -p caustic-installer

      - name: Create zip
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(10)
          7z a "caustic-installer-$version-windows-x86_64.zip" target/release/caustic-installer.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${env:TAG}" caustic-installer-*-windows-x86_64.zip

  publish:
    name: Publish release
    needs: [create-release, build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Mark release as non-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${TAG}" --draft=false
