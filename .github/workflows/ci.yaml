name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: nix flake check
        run: nix flake check

  rust:
    name: Rust
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -p caustic-oci -p caustic-ota --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p caustic-oci -p caustic-ota --locked

  build-images:
    name: Build images (merge queue)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Evaluate flake for aarch64-linux
        run: nix flake show

  runtime-test:
    name: Runtime test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            nix_system: x86_64-linux
          - arch: aarch64
            runner: ubuntu-26.04-arm
            nix_system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          kvm: true

      - name: Run runtime test
        run: nix build .#tests.${{ matrix.nix_system }}.runtime -L

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-slim
    if: always()
    needs: [quick-checks, rust, build-images, runtime-test]
    steps:
      - name: Evaluate job results
        env:
          QUICK_CHECKS: ${{ needs.quick-checks.result }}
          RUST: ${{ needs.rust.result }}
          BUILD_IMAGES: ${{ needs.build-images.result }}
          RUNTIME_TEST: ${{ needs.runtime-test.result }}
        run: |
          for name in QUICK_CHECKS RUST BUILD_IMAGES RUNTIME_TEST; do
            result="${!name}"
            echo "$name: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name did not pass"
              exit 1
            fi
          done
