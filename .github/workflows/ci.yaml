name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: nix flake check
        run: nix flake check

  rust:
    name: Rust
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -p caustic-oci -p caustic-ota --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p caustic-oci -p caustic-ota --locked

  build-images:
    name: Build images (merge queue)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Evaluate flake for aarch64-linux
        run: nix flake show

  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-26.04-arm
            nix_system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          kvm: true

      - name: Run NixOS test
        run: nix build .#tests.${{ matrix.nix_system }}.runtime -L

      - name: Run login test
        run: nix build .#tests.${{ matrix.nix_system }}.login -L

      - name: Build boot test artifacts
        run: |
          nix build --no-link \
            .#checks.aarch64-linux.kernel-config \
            .#nixosConfigurations.production.config.boot.kernelPackages.kernel \
            .#nixosConfigurations.production.config.system.build.verityArtifacts \
            .#nixosConfigurations.production.config.system.build.diskImage \
            nixpkgs#qemu \
            nixpkgs#raspberrypifw

      - name: QEMU boot test
        timeout-minutes: 15
        run: |
          KERNEL=$(nix path-info .#nixosConfigurations.production.config.boot.kernelPackages.kernel)
          VERITY=$(nix path-info .#nixosConfigurations.production.config.system.build.verityArtifacts)
          DISK=$(nix path-info .#nixosConfigurations.production.config.system.build.diskImage)
          QEMU=$(nix path-info nixpkgs#qemu)/bin/qemu-system-aarch64
          RPIFW=$(nix path-info nixpkgs#raspberrypifw)

          source "$VERITY/verity.txt"
          SECTORS=$(( data_blocks * 8 ))

          WORKDIR=$(mktemp -d)
          cp "$KERNEL/Image" "$WORKDIR/Image"
          install -m 644 "$DISK" "$WORKDIR/disk.img"
          cp "$RPIFW/share/raspberrypi/boot/bcm2711-rpi-4-b.dtb" "$WORKDIR/bcm2711-rpi-4-b.dtb"

          SERIAL_LOG="$WORKDIR/qemu-serial.log"

          echo "=== QEMU version ==="
          "$QEMU" --version

          echo "=== Running QEMU ==="

          "$QEMU" \
            -M raspi4b \
            -cpu cortex-a72 \
            -serial file:"$SERIAL_LOG" \
            -display none \
            -monitor none \
            -no-reboot \
            -kernel "$WORKDIR/Image" \
            -dtb "$WORKDIR/bcm2711-rpi-4-b.dtb" \
            -drive file="$WORKDIR/disk.img",format=raw,if=sd \
            -netdev user,id=n1,hostfwd=tcp::8080-:80,hostfwd=tcp::8443-:443 \
            -device usb-net,netdev=n1 \
            -append "root=/dev/dm-0 rootfstype=squashfs ro init=/init console=ttyAMA1,115200 earlycon=pl011,mmio32,0xfe201000 ignore_loglevel panic=-1 dm-mod.create=\"vroot,,0,ro,0 $SECTORS verity 1 /dev/mmcblk1p5 /dev/mmcblk1p5 4096 4096 $data_blocks $data_blocks sha256 $root_hash $salt 1 restart_on_corruption\" rootwait" \
            2>"$WORKDIR/qemu-stderr.log" &
          QEMU_PID=$!

          echo "=== Waiting for aperture (up to 500s) ==="
          APERTURE_HTTP=false
          APERTURE_HTTPS=false
          DEADLINE=$(( $(date +%s) + 500 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited"
              break
            fi

            if ! $APERTURE_HTTP && curl -sf -o /dev/null http://localhost:8080/ 2>/dev/null; then
              echo "aperture HTTP responding on :80"
              APERTURE_HTTP=true
            fi

            if ! $APERTURE_HTTPS && curl -sf -k -o /dev/null https://localhost:8443/ 2>/dev/null; then
              echo "aperture HTTPS responding on :443"
              APERTURE_HTTPS=true
            fi

            if $APERTURE_HTTP && $APERTURE_HTTPS; then
              break
            fi

            sleep 5
          done

          kill "$QEMU_PID" 2>/dev/null || true
          sleep 2
          kill -9 "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true

          if [ -s "$WORKDIR/qemu-stderr.log" ]; then
            echo "=== QEMU stderr ==="
            cat "$WORKDIR/qemu-stderr.log"
          fi

          echo "=== Serial output (first 80 lines) ==="
          head -80 "$SERIAL_LOG" 2>/dev/null || echo "(serial log not found)"
          echo "=== Serial output (last 100 lines) ==="
          tail -100 "$SERIAL_LOG" 2>/dev/null || echo "(serial log not found)"

          if grep -q "Emergency Mode" "$SERIAL_LOG" 2>/dev/null; then
            echo "::error::FAILED: system entered emergency mode"
            exit 1
          fi

          if grep -qE "systemd\[1\]:.*running in system mode" "$SERIAL_LOG" 2>/dev/null \
             && grep -q "dm-0.*is ready" "$SERIAL_LOG" 2>/dev/null; then
            echo "::notice::Boot chain completed (verity root mounted, systemd started)"
          else
            echo "::error::FAILED: boot chain did not complete"
            exit 1
          fi

          if ! $APERTURE_HTTP; then
            echo "::error::FAILED: aperture HTTP did not respond on :80"
            exit 1
          fi

          if ! $APERTURE_HTTPS; then
            echo "::error::FAILED: aperture HTTPS did not respond on :443"
            exit 1
          fi

          if grep -qi "dhcp\|dhcpcd\|10\.0\.2\." "$SERIAL_LOG" 2>/dev/null; then
            echo "::notice::DHCP activity detected in serial log"
          else
            echo "::warning::No DHCP activity detected in serial log"
          fi

          echo "::notice::QEMU boot test PASSED"

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-slim
    if: always()
    needs: [quick-checks, rust, build-images, test]
    steps:
      - name: Evaluate job results
        env:
          QUICK_CHECKS: ${{ needs.quick-checks.result }}
          RUST: ${{ needs.rust.result }}
          BUILD_IMAGES: ${{ needs.build-images.result }}
          TEST: ${{ needs.test.result }}
        run: |
          for name in QUICK_CHECKS RUST BUILD_IMAGES TEST; do
            result="${!name}"
            echo "$name: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name did not pass"
              exit 1
            fi
          done
