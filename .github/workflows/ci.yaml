name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: nix flake check
        run: nix flake check

  rust:
    name: Rust
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -p caustic-oci -p caustic-ota --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p caustic-oci -p caustic-ota --locked

  build-images:
    name: Build images (merge queue)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Evaluate flake for aarch64-linux
        run: nix flake show

  runtime-test:
    name: Runtime test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            nix_system: x86_64-linux
          - arch: aarch64
            runner: ubuntu-26.04-arm
            nix_system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          if ! test -e /dev/kvm; then
            sudo modprobe kvm
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          if test -e /dev/kvm; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run runtime test
        run: nix build .#tests.${{ matrix.nix_system }}.runtime -L
