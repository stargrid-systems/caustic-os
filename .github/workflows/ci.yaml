name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: nix flake check
        run: nix flake check

  rust:
    name: Rust
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -p caustic-oci -p caustic-ota --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p caustic-oci -p caustic-ota --locked

  build-images:
    name: Build images (merge queue)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Evaluate flake for aarch64-linux
        run: nix flake show

  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-26.04-arm
            nix_system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          kvm: true

      - name: Run NixOS test
        run: nix build .#tests.${{ matrix.nix_system }}.runtime -L

      - name: Run login test
        run: nix build .#tests.${{ matrix.nix_system }}.login -L

      - name: Build boot test artifacts
        run: |
          nix build --no-link \
            .#checks.aarch64-linux.kernel-config \
            .#nixosConfigurations.production.config.boot.kernelPackages.kernel \
            .#nixosConfigurations.production.config.system.build.verityArtifacts \
            .#nixosConfigurations.production.config.system.build.diskImage \
            .#nixosConfigurations.production.config.system.build.initialRamdisk \
            .#nixosConfigurations.production.config.system.build.toplevel \
            nixpkgs#qemu \
            nixpkgs#raspberrypifw \
            nixpkgs#dtc

      - name: QEMU boot test
        timeout-minutes: 15
        run: |
          KERNEL=$(nix path-info .#nixosConfigurations.production.config.boot.kernelPackages.kernel)
          VERITY=$(nix path-info .#nixosConfigurations.production.config.system.build.verityArtifacts)
          DISK=$(nix path-info .#nixosConfigurations.production.config.system.build.diskImage)
          INITRD=$(nix path-info .#nixosConfigurations.production.config.system.build.initialRamdisk)/initrd
          TOPLEVEL=$(nix path-info .#nixosConfigurations.production.config.system.build.toplevel)
          QEMU=$(nix path-info nixpkgs#qemu)/bin/qemu-system-aarch64
          RPIFW=$(nix path-info nixpkgs#raspberrypifw)
          FDTPUT=$(nix path-info nixpkgs#dtc)/bin/fdtput

          source "$VERITY/verity.txt"
          SECTORS=$(( data_blocks * 8 ))

          WORKDIR=$(mktemp -d)
          cp "$KERNEL/Image" "$WORKDIR/Image"
          cp "$INITRD" "$WORKDIR/initrd"
          install -m 644 "$DISK" "$WORKDIR/disk.img"
          cp "$RPIFW/share/raspberrypi/boot/bcm2711-rpi-4-b.dtb" "$WORKDIR/bcm2711-rpi-4-b.dtb"
          chmod u+w "$WORKDIR/bcm2711-rpi-4-b.dtb"

          echo "=== Disabling watchdog in DTB ==="
          "$FDTPUT" -t s "$WORKDIR/bcm2711-rpi-4-b.dtb" /soc/watchdog@7e100000 status disabled
          echo "Watchdog status set to disabled"

          SERIAL_LOG="$WORKDIR/qemu-output.log"

          echo "=== QEMU version ==="
          "$QEMU" --version

          echo "=== Running QEMU (300s timeout) ==="

          timeout 300 "$QEMU" \
            -M raspi4b,accel=kvm:tcg \
            -cpu cortex-a72 \
            -serial mon:stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            -watchdog-action none \
            -kernel "$WORKDIR/Image" \
            -initrd "$WORKDIR/initrd" \
            -dtb "$WORKDIR/bcm2711-rpi-4-b.dtb" \
            -drive file="$WORKDIR/disk.img",format=raw,if=sd \
            -netdev user,id=n1,hostfwd=tcp::8080-:80,hostfwd=tcp::8443-:443 \
            -device usb-net,netdev=n1 \
            -append "init=$TOPLEVEL/init console=ttyAMA1,115200 earlycon=pl011,mmio32,0xfe201000 ignore_loglevel panic=30 systemd.log_target=kmsg systemd.log_level=info dm-mod.create=\"vroot,,0,ro,0 $SECTORS verity 1 /dev/mmcblk1p5 /dev/mmcblk1p5 4096 4096 $data_blocks $data_blocks sha256 $root_hash $salt 1 restart_on_corruption\" rootwait" \
            2>&1 | tee "$SERIAL_LOG" || true

          echo "=== Serial output (first 80 lines) ==="
          head -80 "$SERIAL_LOG" 2>/dev/null || echo "(serial log not found)"
          echo "=== Serial output (last 300 lines) ==="
          tail -300 "$SERIAL_LOG" 2>/dev/null || echo "(serial log not found)"

          if grep -q "Emergency Mode" "$SERIAL_LOG" 2>/dev/null; then
            echo "::error::FAILED: system entered emergency mode"
            exit 1
          fi

          if grep -q "Failed to spawn.*Read-only file system" "$SERIAL_LOG" 2>/dev/null; then
            echo "::error::FAILED: services cannot spawn (read-only filesystem)"
            exit 1
          fi

          if grep -qi "systemd-remount-fs.*failed\|systemd-remount-fs.*error" "$SERIAL_LOG" 2>/dev/null; then
            echo "::error::FAILED: systemd-remount-fs failed"
            exit 1
          fi

          if grep -qE "systemd\[1\]:.*running in system mode" "$SERIAL_LOG" 2>/dev/null \
             && grep -q "dm-0.*is ready" "$SERIAL_LOG" 2>/dev/null; then
            echo "::notice::Boot chain completed (verity root mounted, systemd started)"
          else
            echo "::error::FAILED: boot chain did not complete"
            exit 1
          fi

          if grep -q "Started Aperture gateway" "$SERIAL_LOG" 2>/dev/null; then
            echo "::notice::Aperture service started"
          else
            echo "::error::FAILED: Aperture service did not start"
            exit 1
          fi

          if grep -qi "dhcp\|dhcpcd\|10\.0\.2\." "$SERIAL_LOG" 2>/dev/null; then
            echo "::notice::DHCP activity detected in serial log"
          else
            echo "::warning::No DHCP activity detected in serial log"
          fi

          echo "=== Scanning serial log for unexpected errors ==="
          grep -iEn 'fail|error|denied|not found|no such file|panic|emergency|cannot|unable|refus|oops|BUG:|timed out|I/O error' "$SERIAL_LOG" 2>/dev/null \
            | grep -ivE \
              -e 'qemu-system-aarch64' \
              -e 'efi: UEFI not found' \
              -e 'bcm2711 dtc.*has been disabled' \
              -e 'raspberrypi-exp-gpio' \
              -e 'reg-fixed-voltage' \
              -e 'gpio-regulator' \
              -e 'uart-pl011.*device link' \
              -e 'fsck.*credential' \
              -e 'fsck.*progress socket' \
              -e 'KDSETMODE' \
              -e 'VT keyboard' \
              -e 'terminal size' \
              -e 'Failed to get terminal' \
              -e 'Failed to query /dev/tty' \
              -e 'Failed to reset VT' \
              -e 'plymouth.*Connection refused' \
              -e 'hwdb.*No data available' \
              -e 'Device allow list pattern' \
              -e 'dev-mmcblk0p[12]' \
              -e 'boot-[ab]\.mount' \
              -e 'Dependency failed for /boot' \
              -e 'Dependency failed for File System Check' \
              -e 'systemd-fsck@dev-mmcblk0p' \
              > /tmp/qemu-errors.log 2>&1

          if [ -s /tmp/qemu-errors.log ]; then
            echo "::error::Unexpected errors found in serial log:"
            cat /tmp/qemu-errors.log
            exit 1
          fi

          echo "::notice::QEMU boot test PASSED"

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-slim
    if: always()
    needs: [quick-checks, rust, build-images, test]
    steps:
      - name: Evaluate job results
        env:
          QUICK_CHECKS: ${{ needs.quick-checks.result }}
          RUST: ${{ needs.rust.result }}
          BUILD_IMAGES: ${{ needs.build-images.result }}
          TEST: ${{ needs.test.result }}
        run: |
          for name in QUICK_CHECKS RUST BUILD_IMAGES TEST; do
            result="${!name}"
            echo "$name: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name did not pass"
              exit 1
            fi
          done
