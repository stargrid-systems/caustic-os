name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: nix flake check
        run: nix flake check --print-build-logs

  build-images:
    name: Build images (merge queue)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Nix with OCI cache
        uses: ./.github/actions/setup-nix-cache
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Evaluate flake for aarch64-linux
        run: nix flake show --system aarch64-linux --print-build-logs
