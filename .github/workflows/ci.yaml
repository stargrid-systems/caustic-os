name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: nix flake check
        run: nix flake check

  rust:
    name: Rust
    runs-on: ubuntu-26.04
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -p caustic-oci -p caustic-ota --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p caustic-oci -p caustic-ota --locked

  build-images:
    name: Build images (merge queue)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - name: Evaluate flake for aarch64-linux
        run: nix flake show

  runtime-test:
    name: Runtime test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            nix_system: x86_64-linux
          - arch: aarch64
            runner: ubuntu-26.04-arm
            nix_system: aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          kvm: true

      - name: Run runtime test
        run: nix build .#tests.${{ matrix.nix_system }}.runtime -L

  boot-test:
    name: Boot test (QEMU)
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          kvm: true
          save: false

      - name: Build artifacts
        run: |
          nix build --no-link \
            .#nixosConfigurations.production.config.boot.kernelPackages.kernel \
            .#nixosConfigurations.production.config.system.build.verityArtifacts \
            .#nixosConfigurations.production.config.system.build.diskImage \
            nixpkgs#qemu \
            nixpkgs#raspberrypifw

      - name: QEMU boot test
        run: |
          KERNEL=$(nix path-info .#nixosConfigurations.production.config.boot.kernelPackages.kernel)
          VERITY=$(nix path-info .#nixosConfigurations.production.config.system.build.verityArtifacts)
          DISK=$(nix path-info .#nixosConfigurations.production.config.system.build.diskImage)
          QEMU=$(nix path-info nixpkgs#qemu)/bin/qemu-system-aarch64
          RPIFW=$(nix path-info nixpkgs#raspberrypifw)

          source "$VERITY/verity.txt"
          SECTORS=$(( data_blocks * 8 ))

          WORKDIR=$(mktemp -d)
          cp "$KERNEL/Image" "$WORKDIR/Image"
          install -m 644 "$DISK" "$WORKDIR/disk.img"
          cp "$RPIFW/share/raspberrypi/boot/bcm2711-rpi-4-b.dtb" "$WORKDIR/bcm2711-rpi-4-b.dtb"

          echo "=== QEMU version ==="
          "$QEMU" --version
          echo "=== Kernel image ==="
          file "$WORKDIR/Image"
          ls -lh "$WORKDIR/Image"
          echo "=== Disk image ==="
          ls -lh "$WORKDIR/disk.img"
          echo "=== DTB ==="
          ls -lh "$WORKDIR/bcm2711-rpi-4-b.dtb"

          echo "=== Running QEMU (TCG, no KVM) ==="

          timeout 300 "$QEMU" \
            -M raspi4b \
            -cpu cortex-a72 \
            -serial mon:stdio \
            -display none \
            -no-reboot \
            -kernel "$WORKDIR/Image" \
            -dtb "$WORKDIR/bcm2711-rpi-4-b.dtb" \
            -drive file="$WORKDIR/disk.img",format=raw,if=sd \
            -append "root=/dev/dm-0 rootfstype=squashfs ro init=/init console=ttyAMA0,115200 earlycon=pl011,mmio32,0xfe201000 ignore_loglevel panic=-1 dm-mod.waitfor=mmcblk0 dm-mod.create=\"vroot,,0,ro,0 $SECTORS verity 1 /dev/mmcblk0p5 /dev/mmcblk0p5 4096 4096 $data_blocks $data_blocks sha256 $root_hash $salt restart_on_corruption\"" \
            > qemu-output.log 2>&1 || true

          echo "=== QEMU output (first 80 lines) ==="
          head -80 qemu-output.log
          echo "=== QEMU output (last 100 lines) ==="
          tail -100 qemu-output.log

          if grep -q "Emergency Mode" qemu-output.log 2>/dev/null; then
            echo "::error::QEMU boot test FAILED: system entered emergency mode"
            exit 1
          fi

          if grep -q "Reached target.*Multi-User" qemu-output.log 2>/dev/null; then
            echo "::notice::QEMU boot test PASSED"
          else
            echo "::error::QEMU boot test FAILED: did not reach multi-user target"
            exit 1
          fi

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-slim
    if: always()
    needs: [quick-checks, rust, build-images, runtime-test, boot-test]
    steps:
      - name: Evaluate job results
        env:
          QUICK_CHECKS: ${{ needs.quick-checks.result }}
          RUST: ${{ needs.rust.result }}
          BUILD_IMAGES: ${{ needs.build-images.result }}
          RUNTIME_TEST: ${{ needs.runtime-test.result }}
          BOOT_TEST: ${{ needs.boot-test.result }}
        run: |
          for name in QUICK_CHECKS RUST BUILD_IMAGES RUNTIME_TEST BOOT_TEST; do
            result="${!name}"
            echo "$name: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name did not pass"
              exit 1
            fi
          done
