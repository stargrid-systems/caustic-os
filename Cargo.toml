[workspace]
resolver = "2"
members = [
    "crates/caustic-installer",
    "crates/caustic-installer-core",
    "crates/caustic-ota",
]

[workspace.dependencies]
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
