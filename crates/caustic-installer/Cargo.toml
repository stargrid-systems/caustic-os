[package]
name = "caustic-installer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
caustic-oci = { workspace = true }
caustic-oci-key = { workspace = true }
directories = { workspace = true }
iced = { workspace = true, features = ["sipper", "tokio", "wayland", "wgpu"] }
rfd = { workspace = true, features = ["xdg-portal", "tokio"] }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
sys-locale = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "sync"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
which = { workspace = true, features = ["real-sys"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
