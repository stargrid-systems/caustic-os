[package]
name = "caustic-installer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio", "sipper"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
which = "8"
